name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch, or tag to build from'
        required: true
        default: 'main'
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - debug
          - release
      release_tag:
        description: 'Release tag to upload APK (leave empty to skip)'
        required: false
        default: ''

concurrency:
  group: apk-build-${{ github.event.inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Pull LFS models
        run: git lfs pull

      - name: Install npm dependencies
        run: |
          cd core
          npm ci
          node scripts/patch-skia.js

      - name: Setup keystore (release only)
        if: inputs.build_type == 'release'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > core/android/spa-release.keystore
          cat > core/android/keystore.properties <<- EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=spa-release.keystore
          EOF

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        run: cd core/android && ./gradlew assembleDebug

      - name: Build release APK
        if: inputs.build_type == 'release'
        run: cd core/android && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartParkingApp-${{ inputs.build_type }}
          path: core/android/app/build/outputs/apk/${{ inputs.build_type }}/app-*.apk
          retention-days: 30

      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            core/android/app/build/outputs/apk/${{ inputs.build_type }}/app-*.apk \
            --clobber
